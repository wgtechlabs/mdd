name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Reusable workflows cannot increase the caller's permissions.
# The pinned orchestrator declares package permissions for its container workflow
# even while that flow is disabled. MDD does not need an OIDC token permission.
permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  build-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@f8263c388160a62f4a0e72ed888e56c8e9159469 # v1.0.0
    secrets: inherit
    with:
      # The Bun lockfile selects the default node-bun profile/package manager.
      # JavaScript/TypeScript CodeQL analyzes source without a compiler build.
      codeql-build-mode: none
      ci-matrix-versions: '["22","24","26"]'
      # setup-bun reads packageManager: bun@1.3.10 from package.json.
      ci-setup-command: test "$(bun --version)" = '1.3.10'
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run lint
      ci-typecheck-command: bun run typecheck
      ci-test-command: bun run test
      ci-coverage-command: bun run coverage
      ci-build-command: bun run build && bun run smoke && bun audit
      # MDD is an application; only mdd-engine publishes to package registries.
      enable-package: false
      # GitHub Releases remain inactive until application delivery is configured.
      # They do not require an MDD npm package or Trusted Publisher.
      enable-release: false
      # Public repositories enable CodeQL; private copies need verified access.
      enable-codeql: ${{ github.event.repository.private == false || vars.MDD_PRIVATE_CODEQL_ENABLED == 'true' }}
